# Gradle JVM options: allocate sufficient heap and metaspace
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Dedicated memory configuration for Kotlin compile daemon and KSP
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Build optimization
org.gradle.parallel=true
org.gradle.caching=true

# Android and Kotlin project settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
